# DrawPhysicsHub CI/CD：推送到 main 自动构建并发布 GitHub Pages。
#
# 前置要求（首次部署前确认一次）：
# 1. 仓库 Settings → Pages → Build and deployment → Source 选择 GitHub Actions；
# 2. 私有仓库使用 Pages 需 GitHub Pro 账户（公开仓库免费）。
# 线上地址：https://sogrey.github.io/DrawPhysicsHub/
# vite base 已设为 '/DrawPhysicsHub/'，路由经 import.meta.env.BASE_URL 自动跟随。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 自动开通 Pages（Source 置为 GitHub Actions）；已开启时此步幂等跳过
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test（vitest 单测 117 项）
        run: pnpm test

      - name: Build（含 vue-tsc 类型检查）
        run: pnpm build

      # SPA history 路由在 GitHub Pages 上的刷新兜底：未匹配路径回退到应用入口
      - name: SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
